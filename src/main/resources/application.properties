spring.application.name=quizopia-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quizopia_db}
spring.datasource.username=${DB_USERNAME:quiz_user}
spring.datasource.password=${DB_PASSWORD:quiz_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Disable schema.sql and data.sql initialization
spring.sql.init.mode=never

# Multipart upload limits (question import workbook max 5 MiB; allow a small
# overhead on the whole multipart request for part headers).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:redis_password}

# Actuator
# Health is public (permitAll). Details are only shown to authenticated callers so
# anonymous requests cannot learn db/redis component state; `info` is not exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# ============================================================
# Quizopia security configuration.
# Secrets are read from environment variables only; never commit
# real secrets. Missing required secrets cause fail-fast startup.
# ============================================================
quizopia.security.production=false
# Required: Base64 of at least 32 bytes.
quizopia.security.jwt.secret-base64=${QUIZOPIA_JWT_SECRET_BASE64}
quizopia.security.jwt.access-token-lifetime=15m
quizopia.security.jwt.issuer=quizopia-backend
quizopia.security.jwt.audience=quizopia-web
# HS256 is the only supported algorithm (hardcoded in JwtConfig/JwtAccessTokenService);
# no `algorithm` property is exposed to avoid implying it is configurable.
# Required: Base64 of exactly 32 bytes.
quizopia.security.encryption.key-base64=${QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64}
quizopia.security.refresh-token.family-lifetime=7d
quizopia.security.lockout.threshold=5
quizopia.security.lockout.duration=15m
quizopia.security.cookie.name=quizopia_refresh
quizopia.security.cookie.http-only=true
quizopia.security.cookie.same-site=Lax
quizopia.security.cookie.path=/api/auth
quizopia.security.cookie.secure=${QUIZOPIA_COOKIE_SECURE:false}
quizopia.security.cors.allowed-origins=${QUIZOPIA_ALLOWED_ORIGINS:http://localhost:3000}
# When false, refresh/logout require a valid Origin header. Tests set this true.
quizopia.security.cors.allow-missing-origin=false
# Identity-M1: public registration is STUDENT-only. The historic teacher
# invite code is gone; QUIZOPIA_TEACHER_INVITE_CODE (still passed by older
# compose files) is ignored.

# ============================================================
# Email verification OTP (Identity-M1). Policy defaults; see ADR-002 §2.
# ============================================================
quizopia.email-verification.otp-ttl=10m
quizopia.email-verification.max-failed-attempts=5
quizopia.email-verification.resend-cooldown=60s
quizopia.email-verification.email-window=1h
quizopia.email-verification.max-challenges-per-email=5
quizopia.email-verification.ip-window=1h
quizopia.email-verification.max-challenges-per-ip=20
quizopia.email-verification.cleanup.enabled=true
quizopia.email-verification.cleanup.retention=7d
quizopia.email-verification.cleanup.interval=1h

# ============================================================
# Password reset (Identity M5, ADR-004). Challenge TTL and the
# synchronous abuse-bucket admission policy for the public forgot
# endpoint (IP first, then email; one short transaction per request).
# The reset link origin is validated at startup: absolute, no
# userinfo/query/fragment, HTTPS except non-production loopback HTTP.
# ============================================================
quizopia.password-reset.ttl=15m
quizopia.password-reset.frontend-base-uri=${QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI:http://localhost:3000}
quizopia.password-reset.email-window=1h
quizopia.password-reset.max-per-email=5
quizopia.password-reset.email-cooldown=60s
quizopia.password-reset.ip-window=1h
quizopia.password-reset.max-per-ip=20
quizopia.password-reset.intake-capacity=200
quizopia.password-reset.challenge-retention=7d
quizopia.password-reset.bucket-retention=2h
quizopia.password-reset.cleanup.enabled=true
quizopia.password-reset.cleanup.interval=1h
# ============================================================
# OTP mail transport. `smtp` uses spring.mail.* (Mailpit in the compose
# stack, a real provider in production). `capture` records OTPs in memory
# and is used only by the test profile.
# ============================================================
quizopia.mail.mode=smtp
quizopia.mail.from=${QUIZOPIA_MAIL_FROM:Quizopia <no-reply@quizopia.local>}
spring.mail.host=${QUIZOPIA_SMTP_HOST:localhost}
spring.mail.port=${QUIZOPIA_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ============================================================
# Google OIDC (Identity-M1). With no client id configured the provider is
# disabled: no client registration bean, /api/auth/providers reports
# google=false and the login button is hidden. NEVER put the client secret
# in the frontend.
# ============================================================
quizopia.oauth.frontend-redirect-url=${QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}
quizopia.oauth.google.client-id=${QUIZOPIA_GOOGLE_CLIENT_ID:}
quizopia.oauth.google.client-secret=${QUIZOPIA_GOOGLE_CLIENT_SECRET:}
quizopia.oauth.google.issuer=${QUIZOPIA_GOOGLE_ISSUER:https://accounts.google.com}
quizopia.oauth.google.jwks-uri=${QUIZOPIA_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
quizopia.oauth.google.redirect-base-uri=${QUIZOPIA_OAUTH_REDIRECT_BASE_URI:http://localhost:8080}
quizopia.oauth.google.authorization-uri=${QUIZOPIA_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
quizopia.oauth.google.token-uri=${QUIZOPIA_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}

# ============================================================
# Demo data seeding (development/demo only).
# When true, an internal idempotent seeder provisions one school, one grade
# level and one subject at startup, and registration attaches academic
# profiles to that school. Default false: never runs in production unless
# explicitly enabled. The seeder contains no secrets.
# ============================================================
quizopia.demo.data.enabled=${QUIZOPIA_DEMO_DATA_ENABLED:false}