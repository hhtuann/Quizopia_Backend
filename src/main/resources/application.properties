spring.application.name=quizopia-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quizopia_db}
spring.datasource.username=${DB_USERNAME:quiz_user}
spring.datasource.password=${DB_PASSWORD:quiz_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Disable schema.sql and data.sql initialization
spring.sql.init.mode=never

# Multipart upload limits (question import workbook max 5 MiB; allow a small
# overhead on the whole multipart request for part headers).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:redis_password}

# Actuator
# Health is public (permitAll). Details are only shown to authenticated callers so
# anonymous requests cannot learn db/redis component state; `info` is not exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# ============================================================
# Quizopia security configuration.
# Secrets are read from environment variables only; never commit
# real secrets. Missing required secrets cause fail-fast startup.
# ============================================================
quizopia.security.production=false
# Required: Base64 of at least 32 bytes.
quizopia.security.jwt.secret-base64=${QUIZOPIA_JWT_SECRET_BASE64}
quizopia.security.jwt.access-token-lifetime=15m
quizopia.security.jwt.issuer=quizopia-backend
quizopia.security.jwt.audience=quizopia-web
# HS256 is the only supported algorithm (hardcoded in JwtConfig/JwtAccessTokenService);
# no `algorithm` property is exposed to avoid implying it is configurable.
# Required: Base64 of exactly 32 bytes.
quizopia.security.encryption.key-base64=${QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64}
quizopia.security.refresh-token.family-lifetime=7d
quizopia.security.lockout.threshold=5
quizopia.security.lockout.duration=15m
quizopia.security.cookie.name=quizopia_refresh
quizopia.security.cookie.http-only=true
quizopia.security.cookie.same-site=Lax
quizopia.security.cookie.path=/api/auth
quizopia.security.cookie.secure=${QUIZOPIA_COOKIE_SECURE:false}
quizopia.security.cors.allowed-origins=${QUIZOPIA_ALLOWED_ORIGINS:http://localhost:3000}
# When false, refresh/logout require a valid Origin header. Tests set this true.
quizopia.security.cors.allow-missing-origin=false
# Identity-M1: public registration is STUDENT-only. The historic teacher
# invite code is gone; QUIZOPIA_TEACHER_INVITE_CODE (still passed by older
# compose files) is ignored.

# ============================================================
# Email verification OTP (Identity-M1). Policy defaults; see ADR-002 §2.
# ============================================================
quizopia.email-verification.otp-ttl=10m
quizopia.email-verification.max-failed-attempts=5
quizopia.email-verification.resend-cooldown=60s
quizopia.email-verification.email-window=1h
quizopia.email-verification.max-challenges-per-email=5
quizopia.email-verification.ip-window=1h
quizopia.email-verification.max-challenges-per-ip=20
quizopia.email-verification.cleanup.enabled=true
quizopia.email-verification.cleanup.retention=7d
quizopia.email-verification.cleanup.interval=1h

# ============================================================
# Password reset (Identity M5, ADR-004). Challenge TTL and the
# synchronous abuse-bucket admission policy for the public forgot
# endpoint (IP first, then email; one short transaction per request).
# The reset link origin is validated at startup: absolute, no
# userinfo/query/fragment, HTTPS except non-production loopback HTTP.
# ============================================================
quizopia.password-reset.ttl=15m
quizopia.password-reset.frontend-base-uri=${QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI:http://localhost:3000}
quizopia.password-reset.email-window=1h
quizopia.password-reset.max-per-email=5
quizopia.password-reset.email-cooldown=60s
quizopia.password-reset.ip-window=1h
quizopia.password-reset.max-per-ip=20
quizopia.password-reset.intake-capacity=200
quizopia.password-reset.challenge-retention=7d
quizopia.password-reset.bucket-retention=2h
quizopia.password-reset.cleanup.enabled=true
quizopia.password-reset.cleanup.interval=1h
# ============================================================
# OTP mail transport. `smtp` uses spring.mail.* (Mailpit in the compose
# stack, a real provider in production). `capture` records OTPs in memory
# and is used only by the test profile.
# ============================================================
quizopia.mail.mode=smtp
quizopia.mail.from=${QUIZOPIA_MAIL_FROM:Quizopia <no-reply@quizopia.local>}
spring.mail.host=${QUIZOPIA_SMTP_HOST:localhost}
spring.mail.port=${QUIZOPIA_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ============================================================
# Google OIDC (Identity-M1). With no client id configured the provider is
# disabled: no client registration bean, /api/auth/providers reports
# google=false and the login button is hidden. NEVER put the client secret
# in the frontend.
# ============================================================
quizopia.oauth.frontend-redirect-url=${QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}
quizopia.oauth.google.client-id=${QUIZOPIA_GOOGLE_CLIENT_ID:}
quizopia.oauth.google.client-secret=${QUIZOPIA_GOOGLE_CLIENT_SECRET:}
quizopia.oauth.google.issuer=${QUIZOPIA_GOOGLE_ISSUER:https://accounts.google.com}
quizopia.oauth.google.jwks-uri=${QUIZOPIA_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
quizopia.oauth.google.redirect-base-uri=${QUIZOPIA_OAUTH_REDIRECT_BASE_URI:http://localhost:8080}
quizopia.oauth.google.authorization-uri=${QUIZOPIA_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
quizopia.oauth.google.token-uri=${QUIZOPIA_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}

# ============================================================
# Demo data seeding (development/demo only).
# When true, an internal idempotent seeder provisions one school, one grade
# level and one subject at startup, and registration attaches academic
# profiles to that school. Default false: never runs in production unless
# explicitly enabled. The seeder contains no secrets.
# ============================================================
quizopia.demo.data.enabled=${QUIZOPIA_DEMO_DATA_ENABLED:false}

# ============================================================
# Community rate limiting (ADR-006 §9, issue #40). Fixed 1-hour windows
# in PostgreSQL buckets (community_rate_buckets, V26); HMAC keys derived
# from the data-encryption key. Thresholds are per user (or per IP for
# the report/public-read policies) per window. The cleanup sweeper drops
# bucket rows 2h after their window expires.
# ============================================================
quizopia.community.rate-limit.window=1h
quizopia.community.rate-limit.create-update-limit=30
quizopia.community.rate-limit.publish-unpublish-limit=10
quizopia.community.rate-limit.report-user-limit=5
quizopia.community.rate-limit.report-ip-limit=20
quizopia.community.rate-limit.like-limit=60
quizopia.community.rate-limit.rating-limit=30
quizopia.community.rate-limit.comment-create-limit=10
quizopia.community.rate-limit.comment-edit-limit=20
quizopia.community.rate-limit.comment-delete-limit=30
quizopia.community.rate-limit.comment-report-user-limit=5
quizopia.community.rate-limit.comment-report-ip-limit=20
quizopia.community.rate-limit.bookmark-limit=60
quizopia.community.rate-limit.fork-limit=5
quizopia.community.rate-limit.moderation-limit=60
quizopia.community.rate-limit.public-read-ip-limit=6000
quizopia.community.rate-limit.bucket-retention=2h
quizopia.community.rate-limit.cleanup-enabled=true
quizopia.community.rate-limit.cleanup-interval=1h
# ============================================================
# P4-A monitoring activity-event ingest policy (issue #81).
# Fixed windows in PostgreSQL buckets (monitoring_rate_buckets,
# V34); HMAC keys derived from the data-encryption key under a
# distinct key domain. Thresholds are per user per window; the
# client batches telemetry so 30 batches/min is generous.
# ============================================================
quizopia.monitoring.activity-ingest.window=1m
quizopia.monitoring.activity-ingest.rate-limit=30
quizopia.monitoring.activity-ingest.max-batch-size=25
quizopia.monitoring.activity-ingest.max-metadata-bytes=2048

#--- P4-C AI proctoring (issues #88-#90, ADR-008 amendment) ---
# Browser-model detection ingest: 6 batches/min per user (each ≤8 events
# at ~1.5 FPS analysis cadence is generous), own rate-bucket domain
# monitoring:ai-ingest (never shared with activity ingest). Aggregation
# cooldowns: 20s for PHONE/SCREEN/MULTIPLE_PERSONS/LOOKING_AWAY, 45s for
# PERSON_NOT_VISIBLE. worker-key: unset ⇒ the internal worker endpoint is
# deny-all 404 (no worker deployed in P4-C); set via environment only.
quizopia.monitoring.ai-ingest.window=1m
quizopia.monitoring.ai-ingest.rate-limit=6
quizopia.monitoring.ai-ingest.max-batch-size=8
quizopia.monitoring.ai-ingest.max-detections-per-event=8
quizopia.monitoring.ai-ingest.max-payload-bytes=2048
# Worker-path hardening (pre-merge security review): per-attempt event
# admission cap and pre-parse body cap for POST /internal/ai/**.
quizopia.monitoring.ai-ingest.worker-rate-limit=240
quizopia.monitoring.ai-ingest.worker-max-body-bytes=131072
# An alert window older than this closes; the next detection opens a new one.
quizopia.monitoring.ai-ingest.alert-max-window-span=10m
quizopia.monitoring.ai-ingest.alert-cooldown=20s
quizopia.monitoring.ai-ingest.alert-cooldown-person-not-visible=45s
quizopia.monitoring.ai-ingest.worker-key=${QUIZOPIA_AI_INGEST_KEY:}

#--- P4-B camera infrastructure (issues #84-#87, ADR-008 D2/D3) ---
# Media is OFF until the owner points the backend at a LiveKit deployment;
# enabled=true requires QUIZOPIA_LIVEKIT_API_SECRET (fail-fast, no default).
quizopia.media.livekit.enabled=${QUIZOPIA_LIVEKIT_ENABLED:false}
quizopia.media.livekit.api-key=${QUIZOPIA_LIVEKIT_API_KEY:devquizopia}
quizopia.media.livekit.api-secret=${QUIZOPIA_LIVEKIT_API_SECRET:}
quizopia.media.livekit.http-url=${QUIZOPIA_LIVEKIT_HTTP_URL:http://localhost:7880}
quizopia.media.livekit.ws-url=${QUIZOPIA_LIVEKIT_WS_URL:ws://localhost:7880}
quizopia.media.livekit.media-token-ttl=120s
quizopia.media.livekit.admin-token-ttl=60s
quizopia.media.livekit.webhook-max-age=10m
quizopia.media.livekit.request-timeout=5s
quizopia.media.livekit.readiness-lease-ttl=90s
quizopia.media.livekit.preflight-ttl=5m
quizopia.monitoring.camera.reconcile-enabled=true
quizopia.monitoring.camera.reconcile-interval=30s
quizopia.monitoring.camera.housekeeping-interval=1h

# ---------------------------------------------------------------------
# P4-D evidence & recording (issues #91-#94, ADR-009).
# ---------------------------------------------------------------------
quizopia.media.storage.endpoint=${QUIZOPIA_EVIDENCE_MINIO_ENDPOINT:http://localhost:9000}
quizopia.media.storage.access-key=${QUIZOPIA_EVIDENCE_MINIO_ACCESS_KEY:}
quizopia.media.storage.secret-key=${QUIZOPIA_EVIDENCE_MINIO_SECRET_KEY:}
quizopia.media.storage.bucket=${QUIZOPIA_EVIDENCE_BUCKET:quizopia-evidence}
quizopia.media.storage.presign-ttl=300s
quizopia.media.storage.egress-endpoint=${QUIZOPIA_EVIDENCE_MINIO_EGRESS_ENDPOINT:http://host.docker.internal:9000}
# Browser-reachable base for presigned playback URLs; blank presigns on the
# internal endpoint (host-run backend keeps single-endpoint behavior).
quizopia.media.storage.public-endpoint=${QUIZOPIA_EVIDENCE_MINIO_PUBLIC_ENDPOINT:}
quizopia.media.egress.pulse-seconds=120
quizopia.media.egress.rolling-keep=3
quizopia.media.egress.clip-pre-roll=30s
quizopia.media.egress.clip-post-roll=60s
quizopia.media.egress.clip-max-window=5m
quizopia.media.egress.clock-skew-margin=5s
quizopia.media.egress.gap-ignore-threshold=2s
quizopia.media.egress.ffmpeg-command=${QUIZOPIA_FFMPEG_COMMAND:ffmpeg}
quizopia.media.egress.ffmpeg-timeout=60s
quizopia.media.egress.snapshot-max-bytes=2097152
quizopia.media.egress.snapshot-per-alert=3
quizopia.media.egress.snapshot-per-attempt=30
# (multipart limits stay at the file-top 5MB/6MB — the question-import
# workbook size; the snapshot endpoint enforces its own 2 MiB service cap
# on file.getSize() BEFORE reading bytes.)

# P4-D: minio drags Jackson 2 onto the classpath; Hibernate would then pick
# its Jackson 2 JSON mapper for jsonb fields (InvalidDefinitionException on
# tools.jackson JsonNode). Pin the Jackson 3 mapper explicitly.
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

# ---------------------------------------------------------------------
# P5 AI-assisted Quiz Markdown authoring (issues #112/#113).
# OPENAI_API_KEY is backend-environment-only; never expose it to the
# frontend, logs or GitHub. Provider defaults to the OpenAI Responses API
# (structured outputs); "mock" is for automated tests only.
# ---------------------------------------------------------------------
quizopia.ai.authoring.enabled=${QUIZOPIA_AI_AUTHORING_ENABLED:true}
quizopia.ai.authoring.provider=${QUIZOPIA_AI_AUTHORING_PROVIDER:openai}
quizopia.ai.authoring.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
quizopia.ai.authoring.api-key=${OPENAI_API_KEY:}
quizopia.ai.authoring.model=${OPENAI_MODEL:gpt-5.4-mini}
quizopia.ai.authoring.timeout-seconds=90
quizopia.ai.authoring.max-file-bytes=5242880
quizopia.ai.authoring.max-extracted-chars=60000
quizopia.ai.authoring.max-documents=5
quizopia.ai.authoring.max-total-document-chars=100000
quizopia.ai.authoring.max-instruction-chars=4000
quizopia.ai.authoring.max-history-messages=20
quizopia.ai.authoring.max-history-message-chars=8000
quizopia.ai.authoring.max-markdown-chars=262144
quizopia.ai.authoring.max-output-tokens=16000
quizopia.ai.authoring.repair-attempts=1
quizopia.ai.authoring.max-author-requests-per-window=20
quizopia.ai.authoring.authoring-window-seconds=3600
