spring.application.name=quizopia-backend

# Multipart upload limits (question import workbook max 5 MiB).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA: Hibernate only validates mappings; Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Flyway: migrations V1-V4 create the real schema in the PostgreSQL container.
spring.flyway.enabled=true

# Logging
logging.level.com.quizopia.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ============================================================
# TEST-ONLY security keys.
# These are fixed, publicly-known test fixtures (32 zero bytes
# / 32 'B' bytes). They MUST NEVER be used outside tests and are
# not loaded in any non-test profile. Production secrets come
# from environment variables only.
# ============================================================
# 32 bytes of 0x42 ('B'); satisfies HS256 minimum of 32 bytes.
quizopia.security.jwt.secret-base64=QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
quizopia.security.jwt.access-token-lifetime=15m
quizopia.security.jwt.issuer=quizopia-backend
quizopia.security.jwt.audience=quizopia-web
# Exactly 32 bytes of zeros; satisfies 256-bit AES requirement.
quizopia.security.encryption.key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
quizopia.security.refresh-token.family-lifetime=7d
quizopia.security.lockout.threshold=5
quizopia.security.lockout.duration=15m
quizopia.security.cookie.name=quizopia_refresh
quizopia.security.cookie.http-only=true
quizopia.security.cookie.same-site=Lax
quizopia.security.cookie.path=/api/auth
quizopia.security.cookie.secure=false
quizopia.security.cors.allowed-origins=http://localhost:3000
# MockMvc requests carry no browser Origin header; allow server-to-server style calls.
quizopia.security.cors.allow-missing-origin=true
quizopia.security.production=false

# Disable the attempt-timeout sweeper in tests so it can't race with tests that
# advance the test Clock past a deadline and assert startAttempt's own
# resumeOrRejectExpired finalization (the sweeper would finalize first).
quizopia.attempt.timeout-sweep.enabled=false

# ============================================================
# Identity-M1 test configuration.
# ============================================================
# OTPs are captured in memory (no SMTP in CI); tests read them from the
# CaptureOtpMailSender bean.
quizopia.mail.mode=capture
# Short resend cooldown so tests can cover the resend flow quickly.
quizopia.email-verification.resend-cooldown=1s
# Cleanup sweeper off in tests (same reasoning as the attempt sweeper).
quizopia.email-verification.cleanup.enabled=false
# Whole suites register many accounts from 127.0.0.1 in one shared context;
# the per-IP issuance cap stays production-tight, tests raise it so OTP
# issuance is never the thing unrelated suites trip over.
quizopia.email-verification.max-challenges-per-ip=10000
# Password-reset tests: reset mails are captured like OTPs (see
# CapturePasswordResetMailSender); the cleanup sweeper stays off and the
# shared-IP bucket cap is raised so unrelated suites never trip over it —
# per-email buckets and the cooldown stay production-tight and are
# exercised with the mutable test clock.
quizopia.password-reset.cleanup.enabled=false
quizopia.password-reset.max-per-ip=10000
# Fake Google client so the authorization endpoint, resolver (state + PKCE)
# and OIDC login chain are exercised. Endpoints point at a never-reachable
# local URI — no external network, no real credentials.
quizopia.oauth.google.client-id=test-google-client-id
quizopia.oauth.google.client-secret=test-google-client-secret
quizopia.oauth.google.issuer=https://fake-issuer.test
quizopia.oauth.google.jwks-uri=http://localhost:1/jwks
quizopia.oauth.google.redirect-base-uri=http://localhost:8181
quizopia.oauth.frontend-redirect-url=http://localhost:3000/auth/callback
# Community rate limiter: cleanup sweeper off; per-user caps raised so
# whole suites never trip over unrelated buckets — saturation behavior
# is exercised with dedicated low-limit contexts (@DirtiesContext).
quizopia.community.rate-limit.cleanup-enabled=false
quizopia.community.rate-limit.create-update-limit=100000
quizopia.community.rate-limit.publish-unpublish-limit=100000
quizopia.community.rate-limit.report-user-limit=100000
quizopia.community.rate-limit.report-ip-limit=100000
quizopia.community.rate-limit.moderation-limit=100000
quizopia.community.rate-limit.public-read-ip-limit=100000
